<style>
  .preview { background:radial-gradient(circle at 50% 45%,#294049,#10171d 72%); border:1px solid #35414d; border-radius:16px; padding:24px; }
  .sample-map { position:relative; min-height:430px; overflow:hidden; border-radius:12px; background:linear-gradient(145deg,rgba(39,58,65,.85),rgba(12,18,23,.95)); }
  .road { position:absolute; height:4px; background:#d8cfb6; opacity:.68; transform-origin:left center; border-radius:99px; }
  .node { position:absolute; transform:translate(-50%,-50%); width:18px; height:18px; border:3px solid #efd282; background:#111820; border-radius:50%; }
  .name { position:absolute; transform:translate(-50%,0); color:#f7f0df; background:rgba(13,19,24,.9); border:1px solid rgba(239,210,130,.8); border-radius:6px; padding:4px 8px; font:600 13px/1.25 system-ui,sans-serif; text-align:center; white-space:nowrap; }

  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; color:#9fb0bd; font-size:13px; }
  .mapping { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px 18px; margin-top:18px; }
  .mapping div { padding:8px 10px; border-radius:8px; background:#172128; color:#dbe4e8; }
  .mapping code { color:#8fa1ad; font-size:11px; display:block; margin-top:3px; }
  @media(max-width:780px){ .mapping{grid-template-columns:1fr 1fr;} }
</style>
