name: PokerApp
options:
  bundleIdPrefix: com.interviewlearning.poker
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  PokerEngine:
    path: ../PokerEngine
settingGroups:
  iOS:
    # Designed for iPad（macOS 目的地构建 iOS 变体，SDK=iphoneos）无需签名团队；
    # 本机无开发团队，真机签名本不可行；模拟器构建（iphonesimulator）不受影响
    "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": NO
  macOS: {}
targets:
  PokerApp:
    type: application
    platform: [iOS, macOS]
    sources: [PokerApp]
    dependencies:
      - package: PokerEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.interviewlearning.poker.app
        SWIFT_STRICT_CONCURRENCY: complete
      groups:
        - ${platform}
  PokerAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PokerAppTests]
    dependencies:
      - target: PokerApp_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PokerApp:
    build:
      targets:
        PokerApp_iOS: all
        PokerApp_macOS: all
    test:
      targets: [PokerAppTests]
