name: PokerApp
options:
  bundleIdPrefix: com.interviewlearning.poker
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  PokerEngine:
    path: ../PokerEngine
settingGroups:
  iOS:
    # 真机安装：自动签名（Team JB7ZKPWM9C，证书 js19950726@163.com）；
    # Designed for iPad 的 macOS 目的地构建 iPhone 变体时同样用此团队签名
    DEVELOPMENT_TEAM: JB7ZKPWM9C
    CODE_SIGN_STYLE: Automatic
  macOS: {}
targets:
  PokerApp:
    type: application
    platform: [iOS, macOS]
    sources: [PokerApp]
    dependencies:
      - package: PokerEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.interviewlearning.poker.app
        SWIFT_STRICT_CONCURRENCY: complete
        # 图标由 Scripts/gen_appicon.swift 生成（双 A 扇形），单尺寸双平台
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      groups:
        - ${platform}
  PokerAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PokerAppTests]
    dependencies:
      - target: PokerApp_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PokerAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PokerAppUITests]
    dependencies:
      - target: PokerApp_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PokerApp_iOS
schemes:
  PokerApp:
    build:
      targets:
        PokerApp_iOS: all
        PokerApp_macOS: all
    test:
      targets: [PokerAppTests]
  # iOS 测试专用 scheme：UI 测试的宿主 app 必须只有 iOS 变体，
  # 否则与 macOS 变体同名（PokerApp.app）时 runner 会拿错平台的产品
  PokerApp_iOS_Tests:
    build:
      targets:
        PokerApp_iOS: all
    test:
      targets: [PokerAppTests, PokerAppUITests]
