name: PokerApp
options:
  bundleIdPrefix: com.interviewlearning.poker
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  PokerEngine:
    path: ../PokerEngine
settingGroups:
  iOS:
    # 真机安装：自动签名（Team JB7ZKPWM9C，证书 js19950726@163.com）；
    # Designed for iPad 的 macOS 目的地构建 iPhone 变体时同样用此团队签名
    DEVELOPMENT_TEAM: JB7ZKPWM9C
    CODE_SIGN_STYLE: Automatic
  macOS: {}
targets:
  PokerApp:
    type: application
    platform: [iOS, macOS]
    sources: [PokerApp]
    dependencies:
      - package: PokerEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.interviewlearning.poker.app
        SWIFT_STRICT_CONCURRENCY: complete
      groups:
        - ${platform}
  PokerAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PokerAppTests]
    dependencies:
      - target: PokerApp_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PokerApp:
    build:
      targets:
        PokerApp_iOS: all
        PokerApp_macOS: all
    test:
      targets: [PokerAppTests]
